<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>deep_lottery-predictor</title>
  <link rel="stylesheet" href="/static/css/styles.css">
</head>
<body>
  <main class="container">
    <header>
      <h1>deep_lottery-predictor</h1>
      <p>Panel experimental para analizar sorteos de EuroMillions y Bonoloto.</p>
      <p class="notice"><strong>Datos ficticios:</strong> estos ejemplos sirven para probar la aplicación. Los sorteos son aleatorios; el análisis no predice ni garantiza premios.</p>
    </header>
    <section class="controls" aria-label="Controles">
      <label for="game">Juego</label>
      <select id="game">
        <option value="euromillions">EuroMillions</option>
        <option value="bonoloto">Bonoloto</option>
      </select>
      <button id="load-data" type="button">Cargar datos</button>
      <span id="status" role="status" aria-live="polite"></span>
    </section>
    <section class="results" aria-labelledby="summary-title">
      <h2 id="summary-title">Resumen</h2>
      <div id="summary"></div>
    </section>
    <section class="results" aria-labelledby="prediction-title">
      <h2 id="prediction-title">Frecuencias históricas</h2>
      <div id="prediction"></div>
    </section>
    <section class="results" aria-labelledby="latest-title">
      <h2 id="latest-title">��ltimo sorteo de muestra</h2>
      <div id="latest-draw"></div>
    </section>
  </main>
  <script src="/static/js/app.js" defer></script>
</body>
</html>
